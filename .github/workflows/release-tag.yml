name: Build signed Windows MSIX packages

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-windows-msix:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Prepare signing certificate
        shell: pwsh
        env:
          MSIX_CERTIFICATE_BASE64: ${{ secrets.INDICOINK_MSIX_CERTIFICATE_BASE64 }}
          MSIX_CERTIFICATE_PASSWORD: ${{ secrets.INDICOINK_MSIX_CERTIFICATE_PASSWORD }}
          INDICOINK_MSIX_PUBLISHER: ${{ vars.INDICOINK_MSIX_PUBLISHER }}
        run: |
          if (-not $env:MSIX_CERTIFICATE_BASE64 -or -not $env:MSIX_CERTIFICATE_PASSWORD -or -not $env:INDICOINK_MSIX_PUBLISHER) {
            throw 'Configure INDICOINK_MSIX_CERTIFICATE_BASE64, INDICOINK_MSIX_CERTIFICATE_PASSWORD, and the INDICOINK_MSIX_PUBLISHER repository variable before publishing a release.'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'indicoink-release.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:MSIX_CERTIFICATE_BASE64))
          "INDICOINK_MSIX_CERTIFICATE=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INDICOINK_MSIX_CERTIFICATE_PASSWORD=$env:MSIX_CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INDICOINK_MSIX_PUBLISHER=$env:INDICOINK_MSIX_PUBLISHER" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set release version
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}".Trim()
          if ($tag.StartsWith('v')) {
            $tag = $tag.Substring(1)
          }

          $version = $tag
          if ($version -match '^(?<core>\d+\.\d+\.\d+)(?<suffix>[A-Za-z]+)(?<num>\d+)$') {
            $version = "$($Matches.core)-$($Matches.suffix.ToLower())$($Matches.num)"
          }

          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$') {
            throw "Release tag '$tag' could not be converted to a valid package version."
          }

          npm version --no-git-tag-version --allow-same-version $version

      - name: Install dependencies
        run: npm install --cache .npm-cache
        env:
          ELECTRON_INSTALL_ARCH: ${{ matrix.arch }}
          npm_config_arch: ${{ matrix.arch }}

      - name: Build signed MSIX
        run: npm run make -- --arch=${{ matrix.arch }}
        env:
          ELECTRON_INSTALL_ARCH: ${{ matrix.arch }}
          npm_config_arch: ${{ matrix.arch }}

      - name: Verify package signature and stage release asset
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $packageDirectory = Join-Path $env:GITHUB_WORKSPACE "out/make/msix/$env:ARCH"
          $packages = @(Get-ChildItem -LiteralPath $packageDirectory -Filter '*.msix' -File -ErrorAction SilentlyContinue)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one MSIX package in $packageDirectory; found $($packages.Count)."
          }
          $packagePath = $packages[0].FullName
          $signtool = Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin' -Filter signtool.exe -Recurse -File | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) {
            throw 'Windows SDK signtool.exe was not found.'
          }
          & $signtool.FullName verify /pa /v $packagePath
          if ($LASTEXITCODE -ne 0) {
            throw 'MSIX signature verification failed.'
          }
          $stagingDirectory = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          New-Item -ItemType Directory -Force -Path $stagingDirectory | Out-Null
          Copy-Item -LiteralPath $packagePath -Destination (Join-Path $stagingDirectory "IndicoInk-$env:RELEASE_TAG-$env:ARCH.msix")

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: indicoink-windows-msix-${{ matrix.arch }}
          path: release-assets/*.msix
          if-no-files-found: error

  publish-release-assets:
    runs-on: windows-latest
    needs: build-windows-msix
    permissions:
      contents: write

    steps:
      - name: Download MSIX packages
        uses: actions/download-artifact@v4
        with:
          pattern: indicoink-windows-msix-*
          path: release-assets
          merge-multiple: true

      - name: Publish MSIX release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            release-assets/*.msix
