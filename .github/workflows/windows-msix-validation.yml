name: Validate Windows MSIX packages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-msix-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-msix:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm install --cache .npm-cache
        env:
          ELECTRON_INSTALL_ARCH: ${{ matrix.arch }}
          npm_config_arch: ${{ matrix.arch }}

      - name: Build development MSIX
        run: npm run make -- --arch=${{ matrix.arch }}
        env:
          ELECTRON_INSTALL_ARCH: ${{ matrix.arch }}
          npm_config_arch: ${{ matrix.arch }}

      - name: Export the package's public development certificate
        shell: pwsh
        env:
          MSIX_ARCH: ${{ matrix.arch }}
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE "out/make/msix/$env:MSIX_ARCH"
          $packages = @(Get-ChildItem -LiteralPath $output -Filter '*.msix' -File)
          if ($packages.Count -ne 1) {
            throw "Expected one MSIX package, found $($packages.Count)."
          }
          $signer = (Get-AuthenticodeSignature -LiteralPath $packages[0].FullName).SignerCertificate
          if ($signer.Subject -ne 'CN=IndicoInk Development') {
            throw 'The MSIX package is missing the expected development signature.'
          }
          [IO.File]::WriteAllBytes((Join-Path $output 'IndicoInk-Development.cer'), $signer.RawData)

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: indicoink-msix-validation-${{ matrix.arch }}
          path: |
            out/make/msix/${{ matrix.arch }}/*.msix
            out/make/msix/${{ matrix.arch }}/IndicoInk-Development.cer
          if-no-files-found: error
          retention-days: 7
